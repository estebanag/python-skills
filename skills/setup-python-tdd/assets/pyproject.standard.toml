[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "D", "B", "PT", "SIM", "RUF", "T20", "PTH", "S", "PGH"]
ignore = ["D107", "ANN401", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "D"]

[tool.ruff.lint.isort]
known-first-party = ["<package_name>"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.poe.tasks]
check = ["_fix", "_format", "_typecheck", "_test"]
ci = ["_lint", "_format-check", "_typecheck", "_test"]

_fix = "ruff check --fix ."
_format = "ruff format ."
_lint = "ruff check ."
_format-check = "ruff format --check ."
_typecheck = "mypy src tests"
_test = "pytest"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-fail-under=80 --cov-report=term-missing"
filterwarnings = ["error"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "ruff>=0.9",
  "poethepoet>=0.30",
]
test = [
  "pytest>=8",
  "pytest-cov>=6",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3",
]
